name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    name: Core (JVM, no Android SDK)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-core-${{ hashFiles('agentlog-core/**/*.gradle*', 'agentlog-core/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-core-

      - name: Test core (SchemaTests + logger/redactor/config)
        working-directory: agentlog-core
        run: ./gradlew test --no-daemon

      - name: Lint core (ktlint)
        working-directory: agentlog-core
        run: ./gradlew ktlintCheck --no-daemon

  android:
    name: Android (AGP library + example app)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept SDK licenses & install packages
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platforms;android-34" "build-tools;34.0.0"

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-android-${{ hashFiles('**/*.gradle*', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-android-

      - name: Build android library (incl. core)
        run: ./gradlew :agentlog-android:build --no-daemon

      - name: Build example app (smoke test integration)
        run: ./gradlew :example:assembleDebug --no-daemon

      - name: Lint all modules (ktlint)
        run: ./gradlew ktlintCheck --no-daemon
