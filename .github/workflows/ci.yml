name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    name: Core (JVM, no Android SDK)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Cache Gradle
        uses: actions/cache@v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-core-${{ hashFiles('agentlog-core/**/*.gradle*', 'agentlog-core/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-core-

      - name: Test core (SchemaTests + logger/redactor/config)
        working-directory: agentlog-core
        run: ./gradlew test --no-daemon

      - name: Lint core (ktlint)
        working-directory: agentlog-core
        run: ./gradlew ktlintCheck --no-daemon

  android:
    name: Android (AGP library + example app)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      # 不用 android-actions/setup-android：该 action 内部会执行 `sdkmanager tools`，
      # 而 legacy 的 `tools` 包已从 Google SDK 仓库下线，导致 action 直接以
      # `Warning: Failed to find package 'tools'` + exit code 1 失败（与项目代码无关）。
      # ubuntu runner 镜像本身预装了 cmdline-tools / platforms / build-tools，直接复用即可。
      - name: Set up Android SDK
        run: |
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          SDKMANAGER="$(command -v sdkmanager || ls -d "$SDK"/cmdline-tools/*/bin/sdkmanager | tail -1)"
          echo "using sdkmanager: $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          # 幂等：已安装时 sdkmanager 会跳过，重复执行无副作用
          "$SDKMANAGER" --install "platforms;android-34" "build-tools;34.0.0"
          echo "--- platforms ---"; ls "$SDK/platforms"
          echo "--- build-tools ---"; ls "$SDK/build-tools"

      - name: Cache Gradle
        uses: actions/cache@v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-android-${{ hashFiles('**/*.gradle*', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-android-

      - name: Build android library (incl. core)
        run: ./gradlew :agentlog-android:build --no-daemon

      - name: Build example app (smoke test integration)
        run: ./gradlew :example:assembleDebug --no-daemon

      - name: Lint all modules (ktlint)
        run: ./gradlew ktlintCheck --no-daemon
